<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a4b8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7fc9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="50" cy="170" r="80" fill="url(#accent)"/>
  <circle cx="380" cy="30" r="100" fill="url(#accent)"/>
  <text x="200" y="90" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">INTCO MEDICAL</text>
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#b3e5fc" text-anchor="middle">Product Catalogue</text>
  <text x="200" y="155" font-family="Arial, sans-serif" font-size="13" fill="#81d4fa" text-anchor="middle">Medical Equipment &amp; Supplies</text>
  <g transform="translate(160, 15)">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="12" x2="80" y2="12" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="22" x2="55" y2="22" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="32" x2="70" y2="32" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
